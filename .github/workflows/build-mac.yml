name: Build macOS App

on:
  workflow_dispatch:
  push:
    branches:
      - claude/mac-clipboard-manager-bcprmu
    paths:
      - 'src/**'
      - 'package.json'
      - 'package-lock.json'
      - 'electron.vite.config.mjs'
      - '.github/workflows/build-mac.yml'

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm ci

      - run: npm run dist
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - uses: actions/upload-artifact@v4
        with:
          name: Carpet-macOS
          path: dist/*.dmg
          if-no-files-found: error
